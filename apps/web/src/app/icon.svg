<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Video Camera & Wave Stack Symbol -->
  <g filter="url(#glow)">
    <!-- Video Camera Body -->
    <rect x="18" y="16" width="18" height="14" rx="4" fill="url(#iconGrad)" />
    <!-- Camera Lens Cone -->
    <path d="M38 20L46 16.5V29.5L38 26V20Z" fill="url(#iconGrad)" />
    <!-- Lens Highlight Dot -->
    <circle cx="24" cy="23" r="2.5" fill="#ffffff" fill-opacity="0.6" />

    <!-- Waveform / Stack Layers Below -->
    <path d="M16 36C18.5 33.5 21 33.5 24 36C27 38.5 30 38.5 33 36C36 33.5 39 33.5 42 36C45 38.5 47 38.5 48 37" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M16 44C18.5 41.5 21 41.5 24 44C27 46.5 30 46.5 33 44C36 41.5 39 41.5 42 44C45 46.5 47 46.5 48 45" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  </g>
</svg>
