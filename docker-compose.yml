services:
  db:
    # PostGIS, not stock postgres: the domain schema stores geography(POINT,4326)
    # on cities, sites, workers, and jobs. Same Postgres 17 major as the image it
    # replaced, so the existing pgdata volume is read as-is.
    #
    # `imresamu/postgis` rather than the official `postgis/postgis`, which
    # publishes amd64 only — it will not start on an Apple Silicon machine. This
    # is the multi-arch mirror by one of the PostGIS Docker maintainers, same
    # contents. Keep it unless every dev is on x86.
    image: imresamu/postgis:17-3.5
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
